<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>SheSay post</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
  <style>.shared-post{padding:clamp(26px,6vw,55px)}.shared-post .meta{color:var(--she-muted);font:13px/1.6 ui-rounded,"PingFang SC",sans-serif}.shared-post .body{margin-top:28px;white-space:pre-wrap;line-height:2}.post-error{padding:45px 0;text-align:center;color:#a52c54}</style>
</head>
<body>
  <main class="site-shell">
    <article id="post" class="paper shared-post"><p class="eyebrow">SHE SAY · SHARED POST</p><div class="meta">Loading…</div></article>
    <footer class="site-footer"><a href="index.html">Visit SheSay &gt;</a></footer>
  </main>
  <script src="site.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('post');
    const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value; return node.innerHTML; };
    async function load() {
      if (!/^[0-9a-f-]{36}$/i.test(id || '')) { el.innerHTML = '<p class="post-error">This share link is invalid.</p>'; return; }
      const { data, error } = await SheSay.client.rpc('get_shared_post', { target_post_id: id });
      const row = data && data[0];
      if (error || !row) { el.innerHTML = '<p class="post-error">This post does not exist, is unavailable, or cannot be shared publicly.</p>'; return; }
      document.title = `${row.title || 'Post'} · SheSay`;
      el.innerHTML = `<p class="eyebrow">SHE SAY · SHARED POST</p><div class="meta">${escapeHtml(row.author_name || 'SheSay user')} · ${new Date(row.created_at).toLocaleDateString('en-US')}</div><h1>${escapeHtml(row.title || 'Untitled post')}</h1><div class="body">${escapeHtml(row.content || '')}</div>`;
    }
    load();
  </script>
</body>
</html>
