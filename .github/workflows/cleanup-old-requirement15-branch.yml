name: One-time old branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete requirement 15 branch
        shell: bash
        run: |
          git push origin --delete "codex/requirement15-test3-fixes" || true
