name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged temporary branch
        shell: bash
        run: |
          git push origin --delete "fix/requirement15-third-test" || true
