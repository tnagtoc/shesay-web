<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 SheSay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#2b1d27;--plum:#8a456e;--blush:#f7eef1;--paper:#fffaf8;--line:#ead8df}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 12% 4%,#f3cbd8 0 12%,transparent 30%),var(--blush);font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}main{width:min(440px,calc(100% - 36px));padding:34px 30px 30px;background:var(--paper);border:1px solid #fff;border-radius:28px;box-shadow:0 24px 70px #67374c24}.brand{font:700 12px system-ui;letter-spacing:.18em;color:var(--plum)}h1{font:700 32px Georgia,"Noto Serif SC",serif;margin:12px 0 7px}p{color:#765f6b;margin:0 0 23px;line-height:1.6}.tabs{display:flex;margin-bottom:22px;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;padding:10px 14px;color:#806c76;font-size:15px;cursor:pointer}.tabs button.active{color:var(--plum);border-bottom:2px solid var(--plum)}label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}input{display:block;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;outline:none}input:focus{border-color:var(--plum);box-shadow:0 0 0 3px #8a456e16}.submit{width:100%;margin-top:24px;border:0;border-radius:999px;padding:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.submit:disabled{opacity:.55}.notice{min-height:22px;margin:16px 0 0;font-size:14px;line-height:1.55}.error{color:#aa3151}.success{color:#31755e}a{color:var(--plum)}
</style></head><body><main><div class="brand">SHE SAY / ACCOUNT</div><h1 id="title">欢迎回来</h1><p id="subtitle">登录后可以在网页查看你的美元钱包余额。</p><div class="tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">注册</button></div><form id="form"><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="至少 6 位"><button id="submit" class="submit" type="submit">登录并进入钱包</button></form><div id="notice" class="notice" aria-live="polite"></div><p style="margin-top:22px;font-size:14px"><a href="index.html">← 返回官网</a></p></main><script>
const sb=window.supabase.createClient('https://suxprwbmoakcbopjuosa.supabase.co','sb_publishable_JsggCmnvB1Q50l5z2W11Uw_AfKLxCx7');const $=id=>document.getElementById(id);let mode=location.hash==='#register'?'register':'login';function render(){const registering=mode==='register';$('loginTab').classList.toggle('active',!registering);$('registerTab').classList.toggle('active',registering);$('title').textContent=registering?'创建你的账号':'欢迎回来';$('subtitle').textContent=registering?'使用邮箱创建 SheSay 账号。':'登录后可以在网页查看你的美元钱包余额。';$('password').autocomplete=registering?'new-password':'current-password';$('submit').textContent=registering?'注册':'登录并进入钱包';$('notice').textContent='';$('notice').className='notice'}function setMode(value){mode=value;history.replaceState(null,'',value==='register'?'#register':'#login');render()}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('form').onsubmit=async event=>{event.preventDefault();const email=$('email').value.trim(),password=$('password').value,button=$('submit');button.disabled=true;$('notice').textContent='正在安全处理…';$('notice').className='notice';try{if(mode==='login'){const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;location.replace('wallet.html')}else{const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://xn--1uss88i.com/wallet.html'}});if(error)throw error;if(data.session){location.replace('wallet.html')}else{$('notice').textContent='注册成功，请到邮箱点击验证链接后进入钱包。';$('notice').className='notice success'}}}catch(error){$('notice').textContent=error.message||'操作失败，请稍后重试。';$('notice').className='notice error'}finally{button.disabled=false}};render();
