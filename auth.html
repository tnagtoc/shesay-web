<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>登录或注册 · SheSay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoaded&render=explicit" async defer></script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="auth-stage">
    <section class="paper auth-card">
      <a class="brand-link" href="index.html"><img class="brand-mark" src="app-icon.png" alt=""><span class="brand-word"><strong>SheSay</strong><small>她说 · SHE SAY</small></span></a>
      <p class="eyebrow" style="margin-top:28px">ACCOUNT</p>
      <h1 id="title">欢迎回来</h1>
      <p id="subtitle" class="auth-subtitle">使用邮箱与密码登录，进入你的 SheSay 钱包。</p>

      <div class="tabs" role="tablist" aria-label="账号操作">
        <button id="loginTab" type="button" class="active" role="tab">登录</button>
        <button id="registerTab" type="button" role="tab">注册</button>
      </div>

      <form id="form" novalidate>
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="email" required placeholder="name@example.com">

        <div id="nicknameField" class="hidden">
          <label for="nickname">昵称</label>
          <input id="nickname" type="text" autocomplete="nickname" minlength="2" maxlength="10" placeholder="2–10 个字符">
        </div>

        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="16" placeholder="6–16 位，不含空格">

        <div id="verifyFields" class="hidden">
          <label for="code">邮箱验证码</label>
          <div class="code-row">
            <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="输入邮箱中的验证码">
            <button id="sendCode" class="button ghost" type="button">发送验证码</button>
          </div>
          <div id="captcha" class="captcha-wrap"></div>
          <p class="auth-note">验证码用于确认邮箱所有权。若邮箱已注册，验证后可选择登录原账号或删除原账号及数据后新建。</p>
        </div>

        <button id="submit" class="button auth-submit" type="submit">登录并进入钱包</button>
      </form>
      <div id="notice" class="notice" aria-live="polite"></div>

      <div id="existingChoice" class="choice-panel hidden" aria-live="polite">
        <p><strong>该邮箱已注册。</strong><br>验证码已确认由你持有。你可以直接登录原账号并保留全部数据，或删除原账号和数据后新建账号；删除不可恢复。</p>
        <button id="keepAccount" class="button" type="button">登录原账号，保留所有数据</button>
        <button id="replaceAccount" class="button ghost replace" type="button">删除原账号和数据，新建账号</button>
      </div>
      <p class="auth-note" style="margin-top:25px"><a href="index.html">← 返回官网</a></p>
    </section>
  </main>

  <script src="site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sb = SheSay.client;
    let mode = location.hash === '#register' ? 'register' : 'login';
    let challengeId = null;
    let captchaWidget = null;
    let captchaToken = '';
    let verifiedSession = null;

    function showNotice(message = '', kind = '') {
      $('notice').textContent = message;
      $('notice').className = `notice ${kind}`;
    }
    function registrationValuesValid() {
      const nickname = $('nickname').value.trim();
      const password = $('password').value;
      if (nickname.length < 2 || nickname.length > 10) throw new Error('昵称需为 2–10 个字符。');
      if (password.length < 6 || password.length > 16 || /\s/.test(password)) throw new Error('密码需为 6–16 位且不含空格。');
    }
    function renderCaptcha() {
      if (mode !== 'register' || !window.hcaptcha || captchaWidget !== null) return;
      captchaWidget = hcaptcha.render('captcha', {
        sitekey: 'e57677ec-021c-445c-8570-cc848e5ae820',
        callback: token => { captchaToken = token; },
        'expired-callback': () => { captchaToken = ''; },
        theme: 'light',
      });
    }
    window.onHcaptchaLoaded = renderCaptcha;

    function render() {
      const registering = mode === 'register';
      $('loginTab').classList.toggle('active', !registering);
      $('registerTab').classList.toggle('active', registering);
      $('title').textContent = registering ? '创建你的账号' : '欢迎回来';
      $('subtitle').textContent = registering
        ? '先验证邮箱，再创建与你一致的 SheSay 账号。'
        : '使用邮箱与密码登录，进入你的 SheSay 钱包。';
      $('nicknameField').classList.toggle('hidden', !registering);
      $('verifyFields').classList.toggle('hidden', !registering);
      $('password').autocomplete = registering ? 'new-password' : 'current-password';
      $('submit').textContent = registering ? '验证验证码并继续' : '登录并进入钱包';
      $('existingChoice').classList.add('hidden');
      showNotice();
      if (registering) setTimeout(renderCaptcha, 0);
    }
    function setMode(nextMode) {
      mode = nextMode;
      challengeId = null;
      verifiedSession = null;
      captchaToken = '';
      if (captchaWidget !== null && window.hcaptcha) hcaptcha.reset(captchaWidget);
      history.replaceState(null, '', nextMode === 'register' ? '#register' : '#login');
      render();
    }
    async function setProfile() {
      const nickname = $('nickname').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;
      const { error } = await sb.auth.updateUser({ password, data: { nickname } });
      if (error) throw error;
      const user = (await sb.auth.getUser()).data.user;
      if (user) {
        const { error: profileError } = await sb.from('profiles').update({
          nickname, email, has_password: true,
        }).eq('id', user.id);
        if (profileError) throw profileError;
      }
    }
    async function verifyRegistration() {
      registrationValuesValid();
      if (!challengeId) throw new Error('请先发送邮箱验证码。');
      const code = $('code').value.trim();
      if (!code) throw new Error('请输入邮箱验证码。');
      const email = $('email').value.trim();
      const { data, error } = await sb.auth.verifyOtp({ email, token: code, type: 'email' });
      if (error) throw error;
      verifiedSession = data.session || (await sb.auth.getSession()).data.session;
      if (!verifiedSession) throw new Error('验证码验证失败，请重新发送。');
      const result = await SheSay.fusion('resolveEmailRegistration', { challengeId }, verifiedSession.access_token);
      if (result.existingAccount) {
        $('existingChoice').classList.remove('hidden');
        showNotice('邮箱验证成功，请选择账号处理方式。', 'success');
        return;
      }
      await setProfile();
      location.replace('wallet.html');
    }
    async function sendCode() {
      const email = $('email').value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('请输入有效的邮箱地址。');
      registrationValuesValid();
      if (!captchaToken) throw new Error('请先完成人机验证。');
      const started = await SheSay.fusion('startEmailRegistration', { email });
      const { error } = await sb.auth.signInWithOtp({ email, options: { captchaToken } });
      if (error) throw error;
      challengeId = started.challengeId;
      showNotice('验证码已发送，请查收邮箱。', 'success');
    }
    $('loginTab').onclick = () => setMode('login');
    $('registerTab').onclick = () => setMode('register');
    $('sendCode').onclick = async () => {
      const button = $('sendCode'); button.disabled = true;
      try { await sendCode(); } catch (error) { showNotice(error.message || '验证码发送失败。', 'error'); }
      finally { button.disabled = false; }
    };
    $('form').onsubmit = async event => {
      event.preventDefault();
      const button = $('submit'); button.disabled = true;
      showNotice('正在安全处理…');
      try {
        if (mode === 'login') {
          const { error } = await sb.auth.signInWithPassword({
            email: $('email').value.trim(), password: $('password').value,
          });
          if (error) throw error;
          location.replace('wallet.html');
        } else {
          await verifyRegistration();
        }
      } catch (error) { showNotice(error.message || '操作失败，请稍后重试。', 'error'); }
      finally { button.disabled = false; }
    };
    $('keepAccount').onclick = () => location.replace('wallet.html');
    $('replaceAccount').onclick = async () => {
      if (!verifiedSession || !confirm('确认删除原账号及全部数据，并用当前信息创建新账号？此操作无法恢复。')) return;
      const button = $('replaceAccount'); button.disabled = true;
      try {
        await SheSay.fusion('replaceExistingEmailAccount', {
          challengeId, password: $('password').value, nickname: $('nickname').value.trim(),
        }, verifiedSession.access_token);
        await sb.auth.signOut();
        const { error } = await sb.auth.signInWithPassword({
          email: $('email').value.trim(), password: $('password').value,
        });
        if (error) throw error;
        location.replace('wallet.html');
      } catch (error) { showNotice(error.message || '新建账号失败。', 'error'); }
      finally { button.disabled = false; }
    };
    render();
  </script>
</body>
</html>
