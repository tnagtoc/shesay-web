<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SheSay 钱包</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#1a1720;--paper:#f8f3ee;--rose:#b34f6f;--line:#e8ddd7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#f2d4dc 0 14%,transparent 35%),var(--paper);color:var(--ink);font:16px Georgia,"Noto Serif SC",serif}.shell{max-width:620px;margin:auto;padding:42px 22px 80px}.brand{letter-spacing:.17em;font:700 12px system-ui;color:var(--rose)}h1{font-size:42px;margin:12px 0}.card{background:#fffdfa;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 50px #75414b14}.amount{font-size:48px;font-weight:700;margin:8px 0 26px}.muted{color:#756a70;line-height:1.65}button{border:0;border-radius:999px;padding:13px 20px;background:var(--ink);color:white;font-weight:700;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--ink);color:var(--ink);margin-left:8px}.hidden{display:none}</style></head><body><main class="shell"><div class="brand">SHE SAY / WALLET</div><h1>你的钱包</h1><section id="loading" class="card muted">正在安全登录并读取余额…</section><section id="wallet" class="card hidden"><div class="muted" id="name">SheSay 用户</div><div class="amount" id="balance">$0.00</div><p class="muted">余额可用于订阅刊物、购买内容和支持作者。</p><button id="refresh">刷新余额</button><button class="secondary" id="logout">退出登录</button></section><section id="login" class="card hidden"><p class="muted">此钱包需从 SheSay APP 安全跳转，或使用官网登录入口。</p><a href="index.html">返回官网首页</a></section></main><script>
const sb=window.supabase.createClient('https://suxprwbmoakcbopjuosa.supabase.co','sb_publishable_JsggCmnvB1Q50l5z2W11Uw_AfKLxCx7');const $=id=>document.getElementById(id);async function load(){const{data:{user}}=await sb.auth.getUser();$('loading').classList.add('hidden');if(!user){$('login').classList.remove('hidden');return}$('wallet').classList.remove('hidden');$('name').textContent=user.user_metadata?.nickname||user.email;const{data}=await sb.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();$('balance').textContent='$'+Number(data?.balance||0).toFixed(2)}$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};load();</script></body></html>
