<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>My wallet · SheSay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="wallet-shell">
    <div class="brand">SHE SAY / WALLET</div>
    <section id="loading" class="paper wallet-card muted">Signing in securely and loading your balance…</section>
    <section id="wallet" class="paper wallet-card hidden">
      <h1>Your wallet</h1>
      <p id="name" class="wallet-name">SheSay user</p>
      <div id="balance" class="amount">$0.00</div>
      <p class="muted">Use your balance to subscribe, purchase content, and support authors.</p>
      <div class="wallet-actions"><button id="refresh" class="button" type="button">Refresh balance</button><button id="logout" class="button ghost" type="button">Log out</button></div>
      <div class="recharge">
        <strong>Top up</strong>
        <p class="muted">Choose a method to begin.</p>
        <div id="paymentOptions" class="payment-options"></div>
        <div id="notice" class="notice" aria-live="polite"></div>
      </div>
    </section>
    <section id="login" class="paper wallet-card hidden"><p class="muted">Log in to your SheSay account first.</p><a href="auth.html#login">Log in or sign up</a></section>
  </main>
  <script src="site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sb = SheSay.client;
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
    })[character]);
    function notice(message, kind = '') { $('notice').textContent = message; $('notice').className = `notice ${kind}`; }
    async function loadPaymentMethods() {
      const { data, error } = await sb.from('payment_methods')
        .select('id,display_name,network,address,note,sort_order')
        .eq('method', 'usdt')
        .order('sort_order')
        .order('id');
      if (error) throw error;
      const methods = data || [];
      $('paymentOptions').innerHTML = methods.length
        ? methods.map(method => `<button class="payment-option" type="button"
            data-network="${escapeHtml(method.network)}"
            data-address="${escapeHtml(method.address)}"
            data-note="${escapeHtml(method.note)}">
            <strong>${escapeHtml(method.display_name)}</strong>
            <span>${escapeHtml(method.network || 'USDT')}</span>
          </button>`).join('')
        : '<p class="muted">No USDT receiving address is currently available.</p>';
      $('paymentOptions').querySelectorAll('.payment-option').forEach(button => {
        button.onclick = () => {
          const details = [
            button.dataset.network && `Network: ${button.dataset.network}`,
            button.dataset.address && `Address: ${button.dataset.address}`,
            button.dataset.note,
          ].filter(Boolean).join('\n');
          notice(details || 'This payment method is not fully configured.', details ? 'success' : 'error');
        };
      });
    }
    async function load() {
      const { data: { user } } = await sb.auth.getUser();
      $('loading').classList.add('hidden');
      if (!user) { $('login').classList.remove('hidden'); return; }
      $('wallet').classList.remove('hidden');
      $('name').textContent = user.user_metadata?.nickname || user.email || 'SheSay user';
      const { data, error } = await sb.from('wallets').select('balance').eq('user_id', user.id).maybeSingle();
      $('balance').textContent = '$' + Number(data?.balance || 0).toFixed(2);
      if (error) notice('Could not load your balance. Please refresh and try again.', 'error');
      try { await loadPaymentMethods(); }
      catch (_) { notice('Could not load USDT payment methods. Please refresh and try again.', 'error'); }
    }
    $('refresh').onclick = load;
    $('logout').onclick = async () => { await sb.auth.signOut(); location.replace('auth.html#login'); };
    load();
  </script>
</body>
</html>
