<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a765c5">
  <title>我的钱包 · SheSay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main class="wallet-shell">
    <header class="site-header">
      <a class="brand-link" href="index.html"><img class="brand-mark" src="app-icon.png" alt=""><span class="brand-word"><strong>SheSay</strong><small>她说 · SHE SAY</small></span></a>
      <nav class="site-nav"><a href="index.html">官网首页</a><a class="nav-cta" href="auth.html#login">账号</a></nav>
    </header>
    <section id="loading" class="paper wallet-card muted">正在安全登录并读取余额…</section>
    <section id="wallet" class="paper wallet-card hidden">
      <p class="eyebrow">SHE SAY WALLET</p>
      <h1>你的钱包</h1>
      <p id="name" class="wallet-name">SheSay 用户</p>
      <div id="balance" class="amount">$0.00</div>
      <p class="muted">余额可用于订阅刊物、购买内容和支持作者。</p>
      <div class="wallet-actions"><button id="refresh" class="button" type="button">刷新余额</button><button id="logout" class="button ghost" type="button">退出登录</button></div>
      <div class="recharge">
        <p class="eyebrow">RECHARGE</p>
        <h2>充值方式</h2>
        <p class="muted">官网保留支付宝与 USDT 两种充值入口；实际扣款会在支付服务配置完成后开启。</p>
        <div class="payment-options">
          <button class="payment-option" type="button" data-method="alipay"><strong>支付宝充值</strong><span>使用人民币充值 SheSay 钱包余额。</span></button>
          <button class="payment-option" type="button" data-method="usdt"><strong>USDT 充值</strong><span>通过链上 USDT 为 SheSay 钱包充值。</span></button>
        </div>
        <div id="notice" class="notice" aria-live="polite"></div>
      </div>
    </section>
    <section id="login" class="paper wallet-card hidden"><p class="eyebrow">SHE SAY WALLET</p><h1>先登录账号</h1><p class="muted">登录后即可查看钱包余额，并使用支付宝或 USDT 充值入口。</p><div class="wallet-actions"><a class="button" href="auth.html#login">登录或注册</a></div></section>
  </main>
  <script src="site.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const sb = SheSay.client;
    function notice(message, kind = '') { $('notice').textContent = message; $('notice').className = `notice ${kind}`; }
    async function load() {
      const { data: { user } } = await sb.auth.getUser();
      $('loading').classList.add('hidden');
      if (!user) { $('login').classList.remove('hidden'); return; }
      $('wallet').classList.remove('hidden');
      $('name').textContent = user.user_metadata?.nickname || user.email || 'SheSay 用户';
      const { data, error } = await sb.from('wallets').select('balance').eq('user_id', user.id).maybeSingle();
      $('balance').textContent = '$' + Number(data?.balance || 0).toFixed(2);
      if (error) notice('余额读取失败，请刷新后重试。', 'error');
    }
    $('refresh').onclick = load;
    $('logout').onclick = async () => { await sb.auth.signOut(); location.replace('auth.html#login'); };
    document.querySelectorAll('[data-method]').forEach(button => button.onclick = () => {
      const label = button.dataset.method === 'alipay' ? '支付宝充值' : 'USDT 充值';
      notice(`${label}入口已保留。商户收款与链上地址尚未在官网配置，暂不能发起真实扣款。`);
    });
    load();
  </script>
</body>
</html>
